<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social | Saving Swallowtails</title>
<link rel="icon" href="/faviconzs/favicon.ico" type="image/x-icon">

<style>
:root {
  --primary: #25A313;
  --bg: #141414;
  --card: #ffffff;
  --text-dark: #1f1f1f;
}

/* Base */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: white;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
header {
  background: var(--primary);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-title {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: white;
  text-decoration: none;
}

.logo-title img {
  height: 50px;
}

nav a {
  color: white;
  margin-left: 1rem;
  text-decoration: none;
  font-weight: bold;
}

/* Content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  text-align: center;
}

.main h1 {
  color: var(--primary);
  font-size: 2.5rem;
  margin-bottom: 1rem;
}

.main p {
  font-size: 1.2rem;
  margin-bottom: 2rem;
}

/* Button */
.button {
  display: inline-block;
  padding: 0.8rem 1.5rem;
  background: var(--primary);
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 1.1rem;
}

.button:hover {
  background: #1c7d10;
}

/* Footer */
footer {
  text-align: center;
  padding: 1rem;
  background: var(--primary);
}
</style>
</head>

<body>

<header>
  <a href="/" class="logo-title">
    <img src="/SavingSwallowtailsLogo copy.png">
    <h2>Saving Swallowtails</h2>
  </a>

  <nav>
    <a href="/">Home</a>
    <a href="/research/">Research</a>
    <a href="/people/">People</a>
    <a href="/social/">Social</a>
    <a href="/get-involved/">Get Involved</a>
  </nav>
</header>

<!-- MAIN CONTENT -->
<div class="main">
  <h1>Follow Our Work</h1>
  <p>Stay updated with our latest research, fieldwork, and conservation efforts.</p>

  <a href="https://www.instagram.com/saving_swallowtails" target="_blank" class="button">
    Visit Our Instagram →
  </a>
</div>

<footer>
  <p>&copy; 2026 Saving Swallowtails</p>
</footer>

</body>
