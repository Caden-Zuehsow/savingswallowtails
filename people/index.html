<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People | Saving Swallowtails</title>
<link rel="icon" href="/faviconzs/favicon.ico" type="image/x-icon">

<style>
:root {
  --primary: #25A313;
  --primary-dark: #1c7d10;
  --bg: #141414;
  --card: #ffffff;
  --text-dark: #1f1f1f;
}

/* Base */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: white;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
header {
  background: var(--primary);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-title {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: white;
  text-decoration: none;
}

.logo-title img {
  height: 50px;
}

nav a {
  color: white;
  margin-left: 1rem;
  text-decoration: none;
  font-weight: bold;
}

/* Content */
.main {
  flex: 1;
  padding: 3rem 1rem;
  text-align: center;
}

.main h1 {
  color: var(--primary);
  font-size: 2.5rem;
  margin-bottom: 2.5rem;
  letter-spacing: 0.5px;
}

/* People Cards */
.people-container {
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  max-width: 800px;
  margin: auto;
}

.person {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: 14px;
  padding: 1rem;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.person:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.45);
}

.person-inner {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

/* Image */
.person img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  border: 3px solid rgba(255,255,255,0.8);
  background: white;
}

/* Text box */
.person-text {
  background: var(--card);
  color: var(--text-dark);
  padding: 1.2rem 1.4rem;
  border-radius: 10px;
  flex: 1;
  text-align: left;
}

.person-text h2 {
  margin: 0;
  font-size: 1.5rem;
  letter-spacing: 0.3px;
}

.person-text p {
  margin: 0.4rem 0 0;
  font-weight: 600;
  color: var(--primary);
  font-size: 1rem;
}

/* Footer */
footer {
  text-align: center;
  padding: 1rem;
  background: var(--primary);
}
</style>
</head>

<body>

<header>
  <a href="/" class="logo-title">
    <img src="/SavingSwallowtailsLogo copy.png">
    <h2>Saving Swallowtails</h2>
  </a>

  <nav>
    <a href="/">Home</a>
    <a href="/research/">Research</a>
    <a href="/people/">People</a>
    <a href="/social/">Social</a>
    <a href="/get-involved/">Get Involved</a>
  </nav>
</header>

<div class="main">
  <h1>Our Team</h1>

  <div class="people-container">

    <div class="person">
      <div class="person-inner">
        <img src="/templogo.png">
        <div class="person-text">
          <h2>Caden Zuehsow</h2>
          <p>Founder</p>
        </div>
      </div>
    </div>

    <div class="person">
      <div class="person-inner">
        <img src="/templogo.png">
        <div class="person-text">
          <h2>Josiah Thurman</h2>
          <p>Founder</p>
        </div>
      </div>
    </div>

    <div class="person">
      <div class="person-inner">
        <img src="/templogo.png">
        <div class="person-text">
          <h2>Esteban Coria</h2>
          <p>Founder</p>
        </div>
      </div>
    </div>

    <div class="person">
      <div class="person-inner">
        <img src="/templogo.png">
        <div class="person-text">
          <h2>Mahlan Dirksen</h2>
          <p>Media Coordinator</p>
        </div>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>&copy; 2026 Saving Swallowtails</p>
</footer>

</body>
</html>
